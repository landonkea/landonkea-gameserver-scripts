name: Syntax check

# Runs automatically on every push and every pull request, so a broken
# script can never get merged without at least this most basic check
# having passed first.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Syntax-check every .sh file
        run: |
          # Find every file ending in .sh anywhere in the repository, and
          # run "bash -n" on each one -- this asks bash to READ the file
          # and confirm it's grammatically valid, WITHOUT actually
          # running any of it (no real commands execute, nothing is
          # installed, nothing on the runner is changed). This is
          # intentionally the same command used throughout local
          # development for this project.
          status=0
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            if ! bash -n "$file"; then
              echo "::error file=$file::Syntax error detected"
              status=1
            fi
          done < <(find . -type f -name "*.sh" -print0)
          exit $status

      - name: ShellCheck (fails only on genuine errors)
        run: |
          # ShellCheck static-analyzes every script for real bugs (unquoted
          # expansions that break on spaces, unreachable code, etc.), not
          # just grammar. "-s bash" tells it every file here is bash even
          # though the profiles/ and lib/ files have no shebang of their
          # own (they're meant to be sourced, never run directly).
          #
          # Severity is deliberately capped to "error" as the pass/fail
          # gate: this codebase's own architecture (config variables a
          # profile sets but never reads itself -- the core installer
          # reads them after sourcing the profile; a validator pattern
          # explicitly reviewed and accepted in CONTRIBUTING.md; etc.)
          # trips ShellCheck's "warning"/"info"/"style" checks in ways
          # that are known false positives here, not real bugs. Gating on
          # "error" keeps this check meaningful (still fails a PR that
          # introduces a genuine ShellCheck-detectable bug) without
          # requiring every future contributor to litter the codebase
          # with per-line disable comments to keep CI green.
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -type f -name "*.sh" -print0 | xargs -0 shellcheck -s bash -S error

      - name: ShellCheck (informational -- warnings/style, does not fail the build)
        if: always()
        run: |
          # Same scan, but at the default severity, and never fails the
          # job -- this surfaces lower-severity findings (unused-looking
          # variables, quoting suggestions, etc.) in the workflow log for
          # a human to skim, without blocking anyone's PR over them.
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -type f -name "*.sh" -print0 | xargs -0 shellcheck -s bash || true

      - name: Confirm every profile satisfies the platform's contract
        run: |
          # This goes a step further than plain syntax checking: it
          # actually loads the real platform script's functions (without
          # running its "main" installer logic -- see the "if
          # BASH_SOURCE... == 0" guard at the very bottom of
          # install-game-server.sh, which is exactly what allows this)
          # and calls load_game_profile on every single profile file,
          # which checks that each one defines every variable and
          # function the platform requires. A profile missing something
          # required fails loudly here, in an automated check, rather
          # than being discovered later by a person running it for real.
          cd multi-game-platform
          sed 's/^readonly //' install-game-server.sh > /tmp/ci-check.sh
          bash << 'EOF'
          source /tmp/ci-check.sh
          trap - ERR
          PROFILES_DIR="$(pwd)/profiles"
          fail=0
          for g in $(list_available_games); do
            if load_game_profile "$g" 2>/tmp/ci-err.txt; then
              echo "OK: $g"
            else
              echo "FAIL: $g -- $(cat /tmp/ci-err.txt)"
              fail=1
            fi
          done
          exit $fail
          EOF

      - name: Run profile smoke test (tests/profile_smoke_test.sh)
        run: |
          # Additive to the checks above, not a replacement: this runs the
          # full contributor-facing smoke harness (bash -n + shellcheck -S
          # error, unit tests, functional validate-config.sh cases, and a
          # --validate-profile/--check --game pass over every profile) and
          # writes its results to test-results/latest.md, uploaded below as
          # a build artifact so a run's outcome is reviewable after the
          # fact without re-running anything locally.
          tests/profile_smoke_test.sh

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-smoke-test-report
          path: test-results/latest.md
          if-no-files-found: warn
