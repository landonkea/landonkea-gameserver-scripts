# docker/docker-compose.yml -- example compose file for the containerized
# runtime option. See docker/README.md for what this is (and isn't) an
# alternative to.
#
# Usage:
#   cd docker
#   docker compose up -d openttd        # just OpenTTD
#   docker compose up -d minecraft      # just Minecraft (reads EULA below first!)
#   docker compose up -d factorio       # just Factorio
#   docker compose up -d mindustry      # just Mindustry
#   docker compose up -d                # all four
#
# All services are independent -- comment out (or `docker compose up -d
# <service>` only) whichever ones you don't want running.

services:
  openttd:
    build:
      context: ./openttd
    container_name: openttd
    restart: unless-stopped
    ports:
      - "3979:3979/tcp"
      - "3979:3979/udp"
    volumes:
      - openttd-data:/data
    environment:
      SERVER_NAME: "My OpenTTD Server"
      SERVER_PORT: "3979"
      MAX_CLIENTS: "8"
      SERVER_PASSWORD: ""

  minecraft:
    build:
      context: ./minecraft
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "25565:25565/tcp"
      - "25575:25575/tcp"
    volumes:
      - minecraft-data:/data
    environment:
      # You must read and accept https://www.minecraft.net/eula and set
      # this to "true" yourself -- it does NOT default to accepted.
      EULA: "false"
      SERVER_PORT: "25565"
      RCON_PORT: "25575"
      MAX_PLAYERS: "20"
      MOTD: "A Minecraft Server"
      DIFFICULTY: "easy"
      GAMEMODE: "survival"
      JAVA_HEAP_GB: "2"
      # Blank disables RCON entirely. Set a real password to enable it.
      RCON_PASSWORD: ""

  factorio:
    build:
      context: ./factorio
    container_name: factorio
    restart: unless-stopped
    ports:
      - "34197:34197/udp"
    volumes:
      - factorio-data:/data
    environment:
      SERVER_NAME: "My Factorio Server"
      SERVER_PORT: "34197"
      MAX_PLAYERS: "0"
      SERVER_PASSWORD: ""
      SAVE_NAME: "world"

  mindustry:
    build:
      context: ./mindustry
    container_name: mindustry
    restart: unless-stopped
    ports:
      - "6567:6567/tcp"
      - "6567:6567/udp"
    volumes:
      - mindustry-data:/data
    environment:
      SERVER_NAME: "My Mindustry Server"
      SERVER_PORT: "6567"
      # Blank = "host" picks a random built-in map (see mindustry/entrypoint.sh).
      MAP: ""
      MODE: "survival"
      JAVA_HEAP_GB: "1"

volumes:
  openttd-data:
  minecraft-data:
  factorio-data:
  mindustry-data:
